name: Bootstrap MSSP Core MVP

on:
  push:
    branches:
      - agent/initial-mssp-core-mvp
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-mvp.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/initial-mssp-core-mvp
          fetch-depth: 0

      - name: Verify and materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/mssp-core-mvp.tar.gz.b64.part* | base64 --decode > /tmp/mssp-core-mvp.tar.gz
          echo '2e9b4cd97c43104e2449b690930169154c4c6ead2e938bc87878af919159551f  /tmp/mssp-core-mvp.tar.gz' | sha256sum --check
          mkdir -p /tmp/mssp-core-mvp
          tar -xzf /tmp/mssp-core-mvp.tar.gz -C /tmp/mssp-core-mvp
          test "$(find /tmp/mssp-core-mvp -type f | wc -l)" -eq 51
          test -f /tmp/mssp-core-mvp/package.json
          test -f /tmp/mssp-core-mvp/package-lock.json
          test -f /tmp/mssp-core-mvp/src/cli.ts
          test -f /tmp/mssp-core-mvp/spec/MSSP-CORE-SPEC-v0.1.md
          test -f /tmp/mssp-core-mvp/.github/workflows/ci.yml
          rsync -a --exclude='.github/workflows/ci.yml' /tmp/mssp-core-mvp/ ./
          rm -rf .bootstrap

      - name: Commit and attempt branch update
        id: branch_update
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short > /tmp/push-diagnostics.txt
          git commit -m 'Materialize MSSP Core MVP source tree' >> /tmp/push-diagnostics.txt 2>&1
          git push origin HEAD:agent/initial-mssp-core-mvp >> /tmp/push-diagnostics.txt 2>&1

      - name: Upload push diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mssp-bootstrap-push-diagnostics
          path: /tmp/push-diagnostics.txt

      - name: Report failed branch update
        if: steps.branch_update.outcome == 'failure'
        run: exit 1
