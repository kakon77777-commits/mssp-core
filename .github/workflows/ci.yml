name: MSSP Core CI

on:
  push:
  pull_request:

concurrency:
  group: mssp-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js lint examples/hello-mssp
      - run: node dist/cli.js island examples/hello-mssp
      - run: node dist/cli.js graph examples/hello-mssp --format mermaid --out architecture.mmd
      - uses: actions/upload-artifact@v4
        with:
          name: mssp-architecture
          path: architecture.mmd
